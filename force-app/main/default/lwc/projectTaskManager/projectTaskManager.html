<template>
    <lightning-card title="Project Phase Completion Tracker" icon-name="standard:opportunity">
      <div class="slds-p-around_medium">
        <template if:true={loading}>
          <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>
  
        <div class="slds-grid slds-wrap slds-var-m-bottom_medium">
          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-right_small">
            <lightning-progress-bar value={progressPercent} variant="base" size="large"></lightning-progress-bar>
            <div class="slds-text-title_caps slds-var-m-top_x-small">
              Completion: {progressPercent}% ({numerator} / {denominator})
            </div>
          </div>
          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-align_absolute-center">
            <template if:true={stamped}>
              <lightning-badge label="Project 80% Complete"></lightning-badge>
              <span class="slds-var-m-left_small">On {stampDateTime}</span>
            </template>
            <template if:false={stamped}>
              <lightning-badge label="Not yet 80%"></lightning-badge>
            </template>
          </div>
        </div>
  
        <div class="slds-var-m-bottom_small slds-grid slds-gutters">
          <div class="slds-col">
            <lightning-input type="search" label="Search Subject" value={searchKey} onchange={handleSearchChange}></lightning-input>
          </div>
          <div class="slds-col slds-align_absolute-center">
            <lightning-button variant="brand" label="Mark Completed" onclick={handleMarkCompleted} disabled={disableMarkCompleted}></lightning-button>
          </div>
        </div>
  
        <lightning-datatable key-field="id"
                             data={filteredRows}
                             columns={columns}
                             draft-values={draftValues}
                             onsave={handleSave}
                             oncancel={handleCancel}
                             onrowselection={handleRowSelection}>
        </lightning-datatable>
      </div>
    </lightning-card>
  </template>
